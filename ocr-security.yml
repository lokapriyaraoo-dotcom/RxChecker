name: OCR Security Suite

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

jobs:
  vitest-ocr-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run OCR security + gateway message tests
        run: npx vitest run src/__tests__/ocr-security.test.ts src/__tests__/deepLinks.test.ts

      - name: Fail if any gateway leak pattern regresses
        run: npx vitest run src/__tests__/ocr-security.test.ts --reporter=verbose
