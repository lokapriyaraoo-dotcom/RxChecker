name: Build Android APK

# Manual: GitHub → Actions → "Build Android APK" → Run workflow.
# Needs one repository secret:  EXPO_TOKEN  (create at expo.dev → Account settings → Access tokens)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Run tests first
        run: npm test
      # EXPO_PUBLIC_OCR_ENDPOINT must be set on EAS, not here:  eas env:create --name EXPO_PUBLIC_OCR_ENDPOINT --value <url> --environment preview --visibility plaintext
      - name: Build APK on EAS (link is printed in the log)
        run: eas build --platform android --profile preview --non-interactive --no-wait
